name: Inkwell
options:
  bundleIdPrefix: com.jordangulbronson
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Inkwell:
    type: application
    platform: iOS
    sources:
      - Inkwell/Sources
      - Inkwell/Resources
    info:
      path: Inkwell/Info.plist
      properties:
        CFBundleDisplayName: Inkwell
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Newsreader-Roman.ttf
          - Newsreader-Italic.ttf
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordangulbronson.inkwell
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  InkwellTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Inkwell/Tests
    dependencies:
      - target: Inkwell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jordangulbronson.inkwell.tests
schemes:
  Inkwell:
    build:
      targets:
        Inkwell: all
    test:
      targets:
        - InkwellTests
