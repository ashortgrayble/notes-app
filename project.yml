name: Inkwell
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Inkwell:
    type: application
    platform: iOS
    sources:
      - Inkwell/Sources
      - Inkwell/Resources
    info:
      path: Inkwell/Info.plist
      properties:
        CFBundleDisplayName: Inkwell
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Newsreader-Roman.ttf
          - Newsreader-Italic.ttf
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.inkwell
        GENERATE_INFOPLIST_FILE: NO
